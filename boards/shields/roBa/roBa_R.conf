CONFIG_ZMK_KEYBOARD_NAME="roBa"

CONFIG_ZMK_POINTING=y
CONFIG_NFCT_PINS_AS_GPIOS=y
CONFIG_ZMK_BLE=y

# +8dBm (recolocado 2026-07-28): quedas que só voltavam religando o teclado.
# Ambiente eletricamente ruidoso, margem de sinal vale o custo de bateria.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Latência de conexão 0 (default ZMK: 30): não pula janelas de conexão.
# Cura lag intermitente do ponteiro que resolvia só reconectando. Custo: bateria.
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0

# Intervalo de conexão fixo em 7,5ms (6 x 1,25ms). O default do ZMK é 6 a 12,
# e o macOS costuma conceder o teto de 15ms: com o PMW3610 a 125Hz (report a
# cada 8ms), metade dos reports espera uma janela inteira na fila. Isso ataca
# pelo outro lado o mesmo problema que motivou baixar o polling pra 125Hz.
# Ressalva: se o macOS recusar 7,5ms ele renegocia pra 15ms e volta ao estado
# de antes, sem prejuízo.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6

# Deep sleep: só dorme após 2h parado (7200000 ms) — economiza bateria à noite
# sem dormir em pausas do dia. Acorda com qualquer tecla.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=7200000
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y



CONFIG_SPI=y
CONFIG_INPUT=y

CONFIG_PMW3610=y
CONFIG_PMW3610_CPI=700
CONFIG_PMW3610_CPI_DIVIDOR=1
CONFIG_PMW3610_ORIENTATION_180=y
# CONFIG_PMW3610_SNIPE_CPI=800
# CONFIG_PMW3610_SNIPE_CPI_DIVIDOR=4
CONFIG_PMW3610_SCROLL_TICK=16
CONFIG_PMW3610_INVERT_X=n
CONFIG_PMW3610_INVERT_SCROLL_X=y
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=3264
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=20
#CONFIG_PMW3610_REST1_DOWNSHIFT_TIME_MS=9600
#CONFIG_PMW3610_REST2_SAMPLE_TIME_MS=
#CONFIG_PMW3610_REST2_DOWNSHIFT_TIME_MS=
#CONFIG_PMW3610_REST3_SAMPLE_TIME_MS=
#CONFIG_PMW3610_REST3_DOWNSHIFT_TIME_MS=
#CONFIG_PMW3610_FORCE_AWAKE=n
# 250Hz RE-TESTE (05/08/2026). Foi reprovado antes por input lag no BT: a
# 250Hz a fila enchia contra a janela de ~15ms que o macOS concedia. Mas
# aquele teste foi ANTES do BT_PERIPHERAL_PREF_MIN/MAX_INT=6 (28/07), que
# pediu 7,5ms: com a janela pela metade cabe o dobro de reports, entao a
# condicao que reprovou os 250 mudou.
#
# Motivo do re-teste: com a bola girando mais livre (rolamentos novos), giro
# rapido deixava de computar. Nao e resolucao/CPI: o sensor correlaciona
# quadros e, se a superficie andou demais entre duas leituras, ele reporta
# ZERO em vez de reportar menos. Ler o dobro de vezes reduz a chance disso.
#
# Se o lag voltar, reverter pra POLLING_RATE_125: significa que o gargalo e
# o macOS e nao a fila.
CONFIG_PMW3610_POLLING_RATE_250=y
# Janela que a MOUSE layer fica ativa depois do último report do sensor.
# Era 300: dava tempo de mover mas não de PARAR, mirar e clicar — o J caía na
# base e saía a letra "j". Os 300 vinham da época do threshold 0, quando ruído
# armava a camada sozinho e janela longa virava lingering. Com o threshold
# filtrando ruído, a janela só começa depois de movimento real. 500 dava mira
# apertada; 1000 = tempo de parar, mirar e clicar no J sem cair pra letra.
# Lingering só afeta J (MB1) e L (MB2) — resto da MOUSE layer já é letra.
CONFIG_PMW3610_AUTOMOUSE_TIMEOUT_MS=1000

# Limiar (|dx|+|dy| por report, 125Hz) pra LIGAR a camada automouse. Já foi 0
# (qualquer 1 count de ruído armava = clique fantasma no meio da digitação) e
# 5 (grosso demais: ajuste fino gera reports de 1-4 counts e a camada nunca
# armava). 2 = exige >=3 counts, mata ruído de 1-2 sem barrar movimento de
# precisão. Não afeta o ponteiro, só a ativação da camada.
CONFIG_PMW3610_MOVEMENT_THRESHOLD=2

CONFIG_PMW3610_SMART_ALGORITHM=y

CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# ZMK Studio desligado em 28/07. Com ele ligado, um keymap salvo pela GUI fica
# gravado na memória interna e SOBREPÕE o keymap compilado: o sintoma é
# "flashei o firmware novo e nada mudou". Todo o keymap aqui é por arquivo,
# então a GUI não paga o risco. Desligado, o firmware sempre usa o compilado.
# O snippet studio-rpc-usb-uart também saiu do build.yaml.
# Pra apagar o que já está gravado, rodar o settings_reset uma vez.
# CONFIG_ZMK_STUDIO=y
# CONFIG_ZMK_STUDIO_LOCKING=n

# NKRO: rollover ilimitado (default reporta max 6 teclas simultâneas)
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y
