CONFIG_NFCT_PINS_AS_GPIOS=y

# +8dBm (recolocado 2026-07-28) — margem pro link split em ambiente ruidoso
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Deep sleep DESLIGADO na esquerda (30/07/2026).
#
# Sintoma: depois de dormir, a esquerda nao voltava sozinha. Testado com a
# direita comprovadamente acordada e conectada ao Mac, martelando tecla na
# esquerda: nao reconectava. So voltava desligando e ligando a metade.
# E o bug conhecido de periferico split que nao re-pareia com a central ao
# sair do deep sleep (zmkfirmware/zmk#718); a propria doc do ZMK avisa que
# sair do deep sleep derruba todas as conexoes BLE.
#
# Custo: a esquerda ainda entra em idle, mas a autonomia cai de meses pra
# algo entre 1 e 3 semanas. Ela nao tem trackball, entao o consumo e baixo.
# Se a bateria incomodar, a alternativa e o modulo badjeff/zmk-behavior-
# insomnia, que adia o sleep enquanto o BLE esta conectado e deixa dormir
# quando desconecta. A direita mantem o deep sleep dela (2h) intacto.
CONFIG_ZMK_SLEEP=n

CONFIG_EC11=y
# Thread dedicada pro encoder: na thread global, transições se perdiam sob carga BLE
CONFIG_EC11_TRIGGER_OWN_THREAD=y

CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

CONFIG_ZMK_POINTING=y

